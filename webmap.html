<main class="webmap-page">
  <div class="webmap-page-entete">
    <div>
      <h1>WebMap</h1>
      <p>La carte interactive du serveur : repérez un bien, une zone de cohérence ou l'agence.</p>

  </div>
  <div class="webmap-boite webmap-boite--page" id="webmap">
    <iframe src="/api/carte/" title="Carte interactive du serveur" referrerpolicy="no-referrer" allowfullscreen></iframe>
  </div>
</main>

<footer class="pied-page" id="site-pied"></footer>

<script src="/assets/js/layout.js"></script>

  initialiserLayout("webmap");
  pleinEcran(document.querySelector("[data-plein-ecran]"), document.getElementById("webmap"));

# Pack de déploiement VPS (Docker Compose) — NE TOURNE PAS sur Railway.
# Usage : cd deploy/vps && cp .env.example .env (remplir les vraies valeurs)
#         puis : docker compose up -d --build
#
# Reverse proxy : nginx, sur l'HÔTE (voir nginx-dynasty8.conf et README-VPS.md).
# L'application n'est publiée que sur 127.0.0.1 : jamais exposée directement.

services:
  # Migration de la base : SEUL service à utiliser le compte administrateur
  # PostgreSQL. Il applique schema.postgres.sql puis crée/ajuste le compte
  # applicatif restreint (SELECT, INSERT, UPDATE, DELETE — jamais CREATE).
  # Tourne une fois à chaque « docker compose up » (idempotent), puis s'arrête.
  # À relancer à la main après une restauration de sauvegarde :
  #     sudo docker compose run --rm migration
  #
  # Aucun code du projet n'est exécuté ici : c'est psql, le client fourni par
  # l'image postgres, qui lit schema.postgres.sql. Le compte restreint y est
  # créé par le bloc final du fichier, qui reçoit son nom et son mot de passe
  # par PGOPTIONS (réglages de session, jamais écrits dans une instruction).
  # Seules les variables nécessaires sont transmises, pas tout le .env.
  migration:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGOPTIONS: "-c dynasty8.compte_app=${APP_DB_USER} -c dynasty8.mdp_app=${APP_DB_PASSWORD} -c dynasty8.exiger_compte_app=on"
    volumes:
      - ../../schema.postgres.sql:/schema.postgres.sql:ro
    command: ["psql", "--no-psqlrc", "-v", "ON_ERROR_STOP=1", "--quiet", "-f", "/schema.postgres.sql"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    # Système de fichiers du conteneur en LECTURE SEULE : le site n'écrit
    # jamais sur le disque (photos envoyées au CDN, journaux sur la sortie
    # standard). Seul /tmp, en mémoire, reste inscriptible au cas où.
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      PORT: "3000"
      # Les mots de passe PostgreSQL du .env ne servent qu'à la migration et à
      # construire DATABASE_URL ci-dessous : le site ne les reçoit pas, et en
      # particulier jamais celui du compte ADMINISTRATEUR.
      POSTGRES_PASSWORD: ""
      APP_DB_PASSWORD: ""
      # Compte RESTREINT (créé par le service « migration ») : l'application
      # n'a aucun droit de création ni de suppression de table.
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA_AUTO: "0"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Publié UNIQUEMENT sur la boucle locale : c'est nginx (sur l'hôte) qui
    # expose le site au public, en proxifiant vers ce port.
    ports:
      - "127.0.0.1:${PORT_LOCAL:-3010}:3000"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Volontairement AUCUN "ports:" : la base n'est jamais exposée en dehors
    # du réseau Docker interne (uniquement joignable par le service "app").

volumes:
  postgres_data:

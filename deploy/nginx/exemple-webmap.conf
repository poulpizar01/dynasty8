# ENTREPRISE — nginx du sous-domaine de la WebMap (hôte annexe, docs/nginx.md). Même conteneur que le site (port 3010) :
# le site reconnaît ce nom par X-Forwarded-Host et sert la carte à part, sans session ni cookie du site.
# Sous-domaine au choix de l'opérateur du VPS : remplacer <sous-domaine-webmap> ci-dessous par celui choisi (ex.
# webmap.dynasty8.fbfa.fr), reporter la même valeur dans WEBMAP_HOTE du .env, puis renommer ce fichier
# <sous-domaine-webmap>.conf avant de le copier dans /etc/nginx/sites-available/.
# Zone de débit à part : une carte charge beaucoup de tuiles d'un coup.

limit_req_zone $binary_remote_addr zone=dynasty8_carte:10m rate=60r/s;

server {
    listen 80;
    listen [::]:80;
    server_name <sous-domaine-webmap>;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

# --- bloc HTTPS : à ajouter une fois le certificat obtenu (nginx refuse un certificat absent) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <sous-domaine-webmap>;

    ssl_certificate     /etc/letsencrypt/live/<sous-domaine-webmap>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<sous-domaine-webmap>/privkey.pem;

    include snippets/deny-hidden.conf;   # chemins cachés (.env, .git…) : jamais servis (fichier absent : deploy/INSTALLATION.md)

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # pas de X-Frame-Options ni de CSP ici : le site pose ceux de la carte (affichage dans la vitrine)
    location / {
        limit_req zone=dynasty8_carte burst=300 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

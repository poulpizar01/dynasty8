# ENTREPRISE — nginx du site Dynasty 8, tiré de server/deploy/nginx.conf.example (rôle de chaque réglage : docs/nginx.md).
# À copier dans /etc/nginx/sites-available/dynasty8.fbfa.fr.conf. Le port 3010 est HOST_PORT du .env.
# Différences avec le modèle : les quatre routes d'envoi de photos ont leur bloc (lien téléchargé puis dépôt sur le
# stockage : parfois plus de 60 s).

limit_req_zone $binary_remote_addr zone=dynasty8:10m rate=30r/s;

# HTTP : uniquement le défi ACME (renouvellement du certificat), tout le reste part en HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dynasty8.fbfa.fr;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

# --- bloc HTTPS : à ajouter une fois le certificat obtenu (nginx refuse un certificat absent) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dynasty8.fbfa.fr;

    ssl_certificate     /etc/letsencrypt/live/dynasty8.fbfa.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dynasty8.fbfa.fr/privkey.pem;

    include snippets/deny-hidden.conf;   # chemins cachés (.env, .git…) : jamais servis (fichier absent : deploy/INSTALLATION.md)

    server_tokens off;
    client_max_body_size 16m;          # images envoyées : 15 Mo max côté site

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # NE PAS ajouter X-Frame-Options ni Content-Security-Policy : le site pose lui-même ceux qui permettent l'affichage
    # dans l'ordinateur en jeu (FolkOS). Un en-tête ajouté ici donnerait une page blanche en jeu.

    location / {
        limit_req zone=dynasty8 burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # contrôle de santé : réservé à Docker
    location = /healthz { return 404; }

    # envoi d'une photo (fichier ou lien) pour une annonce ou un profil : jusqu'à 2 minutes
    location ~ ^/api/(biens|profil)/photo(-lien)?$ {
        limit_req zone=dynasty8 burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}

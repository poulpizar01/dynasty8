<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex">
  <title>Demande en attente — {{nom}}</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
</head>
<body>
  <!-- Compte connecté mais pas (encore) validé (nom imposé par le socle : gestion/attente.html). -->
  <main class="seul">
    <div class="carte">
      <img src="/assets/logo.png" alt="" width="72" height="72">
      <p class="surtitre">Espace employés</p>
      <h1 id="titre">Demande en attente</h1>
      <p class="muet" id="texte">Ta demande d'accès a bien été reçue. Un responsable doit la valider ; reviens plus tard.</p>
      <div class="ligne" style="justify-content:center">
        <button class="btn" type="button" id="quitter">Se déconnecter</button>
        <button class="btn btn--danger" type="button" id="retirer">Retirer ma demande</button>
      </div>
    </div>
  </main>
  <script>
    socle.moi().then(moi => {
      if (moi.statut === 'valide') location.href = 'accueil.html';
      if (moi.statut === 'refuse') {
        document.getElementById('retirer').style.display = 'none';   // un refus ne s'efface pas en supprimant son compte
        document.getElementById('titre').textContent = 'Demande refusée';
        document.getElementById('texte').textContent = 'Ta demande d’accès a été refusée. Pour en parler, contacte un responsable sur Discord.';
      }
    }).catch(() => {});
    document.getElementById('quitter').addEventListener('click', () => socle.deconnexion());
    document.getElementById('retirer').addEventListener('click', async () => {
      if (!confirm('Retirer ta demande ? Ton compte sera supprimé du site.')) return;
      try { await socle.api('/api/moi', { method: 'DELETE' }); location.href = '/'; } catch (e) { alert(e.message); }
    });
  </script>
</body>
</html>

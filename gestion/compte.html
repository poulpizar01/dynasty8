<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex">
  <title>Mon compte — {{nom}}</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
</head>
<body>
  <main class="contenu">
    <p class="surtitre">Espace employés</p>
    <h1 class="page-titre">Mon compte</h1>
    <section class="carte">
      <div class="ligne"><img class="avatar" id="avatar" alt="" hidden><div><strong id="pseudo"></strong><br><span class="muet" id="grade"></span></div></div>
    </section>
    <section class="carte">
      <h2>Nom RP</h2>
      <p class="message" id="msgNom" hidden></p>
      <form id="formNom" class="ligne">
        <input type="text" id="nom" maxlength="64" required style="flex:1;min-width:200px">
        <button class="btn btn--accent">Enregistrer</button>
      </form>
    </section>
    <section class="carte">
      <h2>Supprimer mon compte</h2>
      <p class="muet">Ton compte est effacé du site. Tu pourras te reconnecter plus tard, mais il faudra une nouvelle validation.</p>
      <button class="btn btn--danger" type="button" id="supprimer">Supprimer mon compte</button>
    </section>
  </main>
  <script>
    gestion.coque().then(moi => {
      const avatar = document.getElementById('avatar');
      if (moi.avatar) { avatar.src = moi.avatar; avatar.hidden = false; }
      document.getElementById('pseudo').textContent = `@${moi.pseudo}`;
      document.getElementById('grade').textContent = moi.grade?.libelle || (moi.proprietaire ? 'Propriétaire' : 'Sans grade');
      document.getElementById('nom').value = moi.nom || '';
    });
    document.getElementById('formNom').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('msgNom');
      try { await socle.api('/api/moi', { method: 'PATCH', body: { nom: document.getElementById('nom').value } }); gestion.message(msg, 'Nom enregistré.', true); }
      catch (err) { gestion.message(msg, err.message); }
    });
    document.getElementById('supprimer').addEventListener('click', async () => {
      if (!confirm('Supprimer définitivement ton compte ?')) return;
      try { await socle.api('/api/moi', { method: 'DELETE' }); location.href = '/'; } catch (e) { alert(e.message); }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/layout.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Mon compte — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — mon compte : nom RP, suppression du compte (serveur : socle/routes/comptes.ts, /api/moi). -->
  <main class="admin-contenu">
    <div class="entete-admin">
      <div>
        <h2 style="margin-bottom:2px;">Mon compte</h2>
        <p style="margin:0;font-size:0.88rem;">Votre compte Discord, votre grade et votre nom RP.</p>
      </div>
    </div>
    <div id="zone-message"></div>

    <div class="carte-table" style="padding:20px 22px;margin-bottom:22px;">
      <div class="cellule-compte"><span id="avatar"></span><div><strong id="pseudo"></strong><div class="admin-compte-grade" id="grade"></div></div></div>
    </div>

    <form id="formNom" class="carte-table" style="padding:20px 22px;margin-bottom:22px;">
      <div class="champ">
        <label for="nom">Nom RP</label>
        <input type="text" id="nom" maxlength="64" required>
        <p class="champ-aide">Affiché dans l'espace agents et sur la page « Notre équipe ».</p>
      </div>
      <button class="btn btn-or" type="submit">Enregistrer</button>
    </form>

    <div class="carte-table" style="padding:20px 22px;">
      <h3 class="comptes-sous-titre" style="margin-top:0;">Supprimer mon compte</h3>
      <p class="champ-aide">Votre compte est effacé du site. Vous pourrez vous reconnecter plus tard, mais il faudra une nouvelle validation.</p>
      <button class="btn btn-danger" type="button" id="supprimer">Supprimer mon compte</button>
    </div>
  </main>
  <script>
    gestion.coque('compte').then(moi => {
      const nom = moi.nom || moi.pseudo;
      document.getElementById('avatar').innerHTML = moi.avatar ? `<img class="admin-avatar" src="${echapper(moi.avatar)}" alt="">` : `<span class="admin-avatar">${echapper(nom.slice(0, 2).toUpperCase())}</span>`;
      document.getElementById('pseudo').textContent = `@${moi.pseudo}`;
      document.getElementById('grade').textContent = moi.grade?.libelle || (moi.proprietaire ? 'Propriétaire' : 'Sans grade');
      document.getElementById('nom').value = moi.nom || '';
    });
    document.getElementById('formNom').addEventListener('submit', async e => {
      e.preventDefault();
      try { await socle.api('/api/moi', { method: 'PATCH', body: { nom: document.getElementById('nom').value } }); gestion.message('zone-message', 'Nom enregistré.', 'succes'); }
      catch (err) { gestion.message('zone-message', err.message); }
    });
    document.getElementById('supprimer').addEventListener('click', async () => {
      if (!await gestion.confirmer('Votre compte sera définitivement effacé du site.', 'Supprimer votre compte ?', 'Supprimer')) return;
      try { await socle.api('/api/moi', { method: 'DELETE' }); location.href = '/'; } catch (e) { gestion.message('zone-message', e.message); }
    });
  </script>
</body>
</html>

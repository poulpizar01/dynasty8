<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/raleway-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/assets/js/coherences-guides.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Cohérences — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — les guides de cohérence du site public : présentation Google Slides de chaque zone (lien réglé dans
       Paramètres ; coherences-guides.js, partagé avec /coherence-zone.html), sans quitter l'espace agents. Tout compte validé. -->
  <main class="admin-contenu">
    <div class="entete-admin">
      <div>
        <h1 style="margin-bottom:2px;">Cohérences</h1>
        <p style="margin:0;font-size:0.88rem;">La présentation officielle de chaque zone, la même que sur le site public.</p>
      </div>
    </div>
    <div class="compta-sous-onglets" role="tablist" id="zones"></div>
    <p id="intro" style="max-width:860px;margin:18px 0 22px;"></p>
    <h3 class="comptes-sous-titre" id="guide-titre">Guide complet</h3>
    <div id="presentation" style="max-width:960px;"></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let zone = null;
    function afficher(z) {
      zone = z || zone || ZONES_COHERENCE[0];
      const guide = GUIDES_COHERENCE[zone];
      $('zones').innerHTML = ZONES_COHERENCE.map(x =>
        `<button type="button" class="compta-sous-onglet ${x === zone ? 'actif' : ''}" data-zone="${echapper(x)}">${GUIDES_COHERENCE[x].icone} ${echapper(x)}</button>`).join('');
      $('intro').textContent = guide.intro;
      $('guide-titre').textContent = `Guide complet — ${zone}`;
      monterPresentationCoherence($('presentation'), zone, 'Pas encore de présentation pour cette zone : collez son lien Google Slides dans Paramètres → Liens.');
    }
    $('zones').addEventListener('click', e => { const b = e.target.closest('[data-zone]'); if (b) afficher(b.dataset.zone); });
    gestion.coque('coherences').then(() => afficher()).catch(e => { const p = document.createElement('p'); p.textContent = e.message; document.querySelector('main').prepend(p); });
  </script>
</body>
</html>

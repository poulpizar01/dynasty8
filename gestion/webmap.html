<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!-- polices annoncées tout de suite : prêtes au premier affichage, le texte ne se redessine plus en arrivant -->
  <link rel="preload" href="/assets/fonts/raleway-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>WebMap — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — la carte interactive du serveur dans la page (cadre vers /api/carte/, qui renvoie à son sous-domaine :
       entreprise/carte.ts). Cahier des charges : la carte se lit sur le site, jamais dans un autre onglet ; le plein
       écran se fait sur place (pleinEcran, layout.js). Réservée à la permission « parametres ». -->
  <main class="admin-contenu admin-contenu--pleine">
    <div class="entete-admin">
      <div>
        <h1 style="margin-bottom:2px;">WebMap</h1>
        <p style="margin:0;font-size:0.88rem;">La carte interactive du serveur, la même que sur le site public.</p>
      </div>
      <button type="button" class="btn btn-fantome btn-petit cache" id="plein-ecran">Plein écran</button>
    </div>
    <p class="champ-aide cache" id="non-reglee">La carte n'est pas encore réglée : son adresse se renseigne dans Paramètres, onglet «&nbsp;Google&nbsp;Sheets et carte&nbsp;».</p>
    <div class="webmap-boite webmap-boite--page" id="boite"></div>
  </main>
  <script>
    gestion.coque('webmap').then(async () => {
      const o = await socle.api('/api/outils');
      document.getElementById('non-reglee').classList.toggle('cache', o.webmap);
      if (!o.webmap) { document.getElementById('boite').remove(); return; }
      const cadre = document.createElement('iframe');
      cadre.src = '/api/carte/';
      cadre.title = 'Carte interactive du serveur';
      cadre.referrerPolicy = 'no-referrer';
      cadre.allowFullscreen = true;
      document.getElementById('boite').append(cadre);
      pleinEcran(document.getElementById('plein-ecran'), document.getElementById('boite'));
    }).catch(e => { const p = document.createElement('p'); p.textContent = e.message; document.querySelector('main').prepend(p); });
  </script>
</body>
</html>

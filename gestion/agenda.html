<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <link rel="stylesheet" href="/gestion/agenda.css">
  <script src="/socle/socle.js"></script>
  <script src="/assets/js/layout.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Mon agenda — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — agenda : événements personnels et partagés selon les rôles Discord (serveur : entreprise/routes/agenda.ts,
       règles dans entreprise/agenda-regles.ts). -->
  <main class="admin-contenu admin-contenu--pleine">
    <section id="panneau-agenda" class="panneau-agenda">
      <header class="agenda-entete">
        <div class="agenda-titre">
          <h1>Agenda</h1>
          <p class="agenda-periode" id="agenda-plage-dates" aria-live="polite"></p>
        </div>
        <div class="agenda-commandes">
          <!-- masqué sur téléphone : la vue liste (bandeau de la semaine + rendez-vous du jour) s’impose (agenda.js) -->
          <div class="agenda-vues" role="group" aria-label="Affichage">
            <button type="button" class="agenda-vue-bouton" data-vue="jour" aria-pressed="false">Jour</button>
            <button type="button" class="agenda-vue-bouton actif" data-vue="semaine" aria-pressed="true">Semaine</button>
            <button type="button" class="agenda-vue-bouton" data-vue="mois" aria-pressed="false">Mois</button>
          </div>
          <div class="agenda-navigation">
            <button type="button" class="agenda-fleche agenda-fleche--avant" id="agenda-semaine-precedente" aria-label="Période précédente"><svg class="ico" aria-hidden="true"><use href="#ico-chevron"></use></svg></button>
            <button type="button" class="agenda-aujourdhui-bouton" id="agenda-aujourdhui">Aujourd’hui</button>
            <button type="button" class="agenda-fleche agenda-fleche--apres" id="agenda-semaine-suivante" aria-label="Période suivante"><svg class="ico" aria-hidden="true"><use href="#ico-chevron"></use></svg></button>
          </div>
          <button type="button" class="btn btn-or agenda-ajouter" id="agenda-nouvel-evenement" aria-label="Nouvel événement"><svg class="ico" aria-hidden="true"><use href="#ico-plus"></use></svg><span>Nouvel événement</span></button>
        </div>
      </header>
      <!-- la couleur d’un événement dit qui le voit -->
      <p class="agenda-legende">
        <span class="agenda-legende-titre">Visible par</span>
        <span class="agenda-pastille agenda-vis-perso">Perso</span>
        <span class="agenda-pastille agenda-vis-patrons">Patrons</span>
        <span class="agenda-pastille agenda-vis-direction">Direction</span>
        <span class="agenda-pastille agenda-vis-tous">Tous</span>
      </p>
      <div id="zone-message-agenda"></div>
      <div class="agenda-grille-conteneur" id="agenda-grille-conteneur">
        <div class="agenda-grille" id="agenda-grille"></div>
      </div>
    </section>
  </main>

<div class="modale-fond cache" id="modale-evenement">
  <div class="modale modale-evenement" role="dialog" aria-modal="true" aria-labelledby="titre-modale-evenement">
    <div class="modale-entete">
      <h2 id="titre-modale-evenement">Nouvel événement</h2>
      <button id="fermer-modale-evenement" type="button" aria-label="Fermer">✕</button>
    </div>
    <form id="formulaire-evenement" novalidate>
      <input type="hidden" id="evenement-id">
      <div class="champ">
        <label for="evenement-titre">Titre</label>
        <input type="text" id="evenement-titre" maxlength="80" placeholder="Ex. Visite, Eclipse Tower">
        <p class="champ-erreur cache" id="erreur-evenement-titre">Donnez un titre à l’événement.</p>
      </div>
      <div class="evenement-quand">
        <div class="champ">
          <label for="evenement-jour">Date</label>
          <input type="date" id="evenement-jour">
          <p class="champ-erreur cache" id="erreur-evenement-jour">Date au format jj/mm/aaaa.</p>
        </div>
        <div class="champ">
          <label for="evenement-heure-debut">Début</label>
          <input type="time" id="evenement-heure-debut" step="300">
        </div>
        <div class="champ">
          <label for="evenement-heure-fin">Fin</label>
          <input type="time" id="evenement-heure-fin" step="300">
        </div>
      </div>
      <p class="champ-erreur cache" id="erreur-evenement-heures">Heures au format 24 h (14:30) ; la fin doit être après le début.</p>
      <!-- seules les visibilités que le compte peut créer sont proposées ; « Pour » : la personne d’un « Perso »
           (soi-même, ou une fiche RH : envoi dans son ticket Discord) -->
      <div class="champ">
        <label for="evenement-visibilite">Visible par</label>
        <select id="evenement-visibilite"></select>
      </div>
      <div class="champ cache" id="champ-evenement-pour">
        <label for="evenement-pour">Pour</label>
        <select id="evenement-pour"></select>
        <p class="champ-aide">Pour quelqu’un d’autre : l’événement est posté dans son ticket Discord et apparaît dans son agenda.</p>
      </div>
      <div class="champ">
        <label for="evenement-notes">Notes <small>facultatif</small></label>
        <textarea id="evenement-notes" maxlength="500" rows="3" placeholder="Lieu de rendez-vous, contact, détails…"></textarea>
      </div>
      <p class="champ-aide cache" id="evenement-origine"></p>
      <div id="zone-message-modale-evenement" role="status"></div>
      <div class="evenement-pied">
        <button type="button" class="btn btn-fantome evenement-supprimer cache" id="bouton-supprimer-evenement">Supprimer</button>
        <button type="button" class="btn btn-fantome" id="bouton-annuler-evenement">Annuler</button>
        <button type="submit" class="btn btn-or" id="bouton-enregistrer-evenement">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

  <script src="/gestion/agenda.js"></script>
</body>
</html>

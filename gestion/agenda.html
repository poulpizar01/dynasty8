<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/layout.js"></script>
  <script src="/gestion/gestion.js"></script>
  <title>Mon agenda — {{nom}}</title>
</head>
<body class="page-agents">
  <!-- GESTION — « Mon agenda » : planning personnel, visible du seul agent (serveur : entreprise/routes/agenda.ts). -->
  <main class="admin-contenu admin-contenu--pleine">
    <section id="panneau-agenda" class="panneau-agenda">
      <div class="agenda-entete">
        <div>
          <h2 style="margin-bottom:2px;">Mon agenda</h2>
          <p class="agenda-sous-titre">🔒 Personnel — visible uniquement par vous · <span id="agenda-plage-dates"></span></p>
        </div>
        <div class="agenda-entete-actions">
          <div class="agenda-vue-toggle" role="group" aria-label="Choisir la vue">
            <button type="button" class="agenda-vue-bouton" data-vue="mois">Mois</button>
            <button type="button" class="agenda-vue-bouton actif" data-vue="semaine">Semaine</button>
            <button type="button" class="agenda-vue-bouton" data-vue="jour">Jour</button>
          </div>
          <button type="button" class="btn btn-fantome btn-petit" id="agenda-semaine-precedente" aria-label="Période précédente">‹</button>
          <button type="button" class="btn btn-fantome btn-petit" id="agenda-aujourdhui">Aujourd'hui</button>
          <button type="button" class="btn btn-fantome btn-petit" id="agenda-semaine-suivante" aria-label="Période suivante">›</button>
          <button type="button" class="btn btn-or btn-petit" id="agenda-nouvel-evenement">+ Événement</button>
        </div>
      </div>
      <div id="zone-message-agenda"></div>
      <div class="agenda-grille-conteneur" id="agenda-grille-conteneur">
        <div class="agenda-grille" id="agenda-grille"></div>
      </div>
      <p class="agenda-note">Cliquez sur une case pour ajouter un événement, sur un événement pour le modifier. Chaque compte Discord ne voit que son propre agenda.</p>
    </section>
  </main>

<div class="modale-fond cache" id="modale-evenement">
  <div class="modale" style="max-width:480px;">
    <div class="modale-entete">
      <h3 id="titre-modale-evenement">Nouvel événement</h3>
      <button id="fermer-modale-evenement" type="button" aria-label="Fermer">✕</button>
    </div>
    <div id="zone-message-modale-evenement"></div>
    <form id="formulaire-evenement">
      <input type="hidden" id="evenement-id">
      <div class="champ">
        <label for="evenement-titre">Titre <span class="champ-obligatoire">*</span></label>
        <input type="text" id="evenement-titre" maxlength="80" placeholder="Ex : Visite Eclipse Tower">
        <p class="champ-erreur cache" id="erreur-evenement-titre">Le titre est obligatoire.</p>
      </div>
      <div class="champ">
        <label for="evenement-jour">Date <span class="champ-obligatoire">*</span></label>
        <input type="date" id="evenement-jour">
      </div>
      <div class="champ-deux">
        <div class="champ">
          <label for="evenement-heure-debut">Heure de début <span class="champ-obligatoire">*</span></label>
          <input type="time" id="evenement-heure-debut" step="300">
        </div>
        <div class="champ">
          <label for="evenement-heure-fin">Heure de fin <span class="champ-obligatoire">*</span></label>
          <input type="time" id="evenement-heure-fin" step="300">
        </div>
      </div>
      <p class="champ-erreur cache" id="erreur-evenement-heures">L'heure de fin doit être après l'heure de début.</p>
      <div class="champ">
        <label for="evenement-notes">Notes (optionnel)</label>
        <textarea id="evenement-notes" maxlength="500" placeholder="Détails, lieu de rendez-vous, contact..."></textarea>
      </div>
      <div style="display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;">
        <button type="submit" class="btn btn-or" style="flex:1;">Enregistrer</button>
        <button type="button" class="btn btn-fantome" id="bouton-annuler-evenement">Annuler</button>
        <button type="button" class="btn btn-danger cache" id="bouton-supprimer-evenement">Supprimer</button>
      </div>
    </form>
  </div>
</div>

  <script src="/gestion/agenda.js"></script>
</body>
</html>

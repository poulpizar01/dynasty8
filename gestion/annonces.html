<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-name" content="{{nom}}">
  <meta name="robots" content="noindex">
  <title>Annonces — {{nom}}</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/gestion/gestion.css">
  <script src="/socle/socle.js"></script>
  <script src="/gestion/gestion.js"></script>
</head>
<body>
  <!-- EXEMPLE de page métier (routes : server/src/entreprise/routes/annonces.ts). À garder, transformer ou supprimer. -->
  <main class="contenu">
    <p class="surtitre">Espace employés</p>
    <h1 class="page-titre">Annonces</h1>
    <section class="carte" id="publier" hidden>
      <h2>Publier une annonce</h2>
      <p class="message" id="msg" hidden></p>
      <form id="form">
        <div class="champ"><label for="titre">Titre</label><input type="text" id="titre" maxlength="120" required></div>
        <div class="champ"><label for="texte">Texte</label><textarea id="texte" maxlength="4000" required></textarea></div>
        <div class="ligne"><label class="case"><input type="checkbox" id="epingle"> Épingler en haut</label><button class="btn btn--accent">Publier</button></div>
      </form>
    </section>
    <div id="liste"><p class="vide">Chargement…</p></div>
  </main>
  <script>
    let peutPublier = false;
    const liste = document.getElementById('liste');

    async function afficher() {
      try {
        const annonces = await socle.api('/api/annonces');
        liste.innerHTML = annonces.length ? annonces.map(a => `
          <article class="carte" data-id="${a.id}">
            <div class="ligne"><h2 style="margin:0;flex:1">${socle.esc(a.titre)}</h2>${a.epingle ? '<span class="badge badge--alerte">Épinglée</span>' : ''}</div>
            <p class="muet">${socle.date(a.creeLe, true)}${a.auteur ? ` · ${socle.esc(a.auteur)}` : ''}</p>
            <p style="white-space:pre-line;overflow-wrap:anywhere">${socle.esc(a.texte)}</p>
            ${peutPublier ? `<div class="ligne"><button class="btn btn--petit" data-epingle="${a.epingle ? '' : '1'}">${a.epingle ? 'Désépingler' : 'Épingler'}</button><button class="btn btn--petit btn--danger" data-retirer>Retirer</button></div>` : ''}
          </article>`).join('') : '<p class="vide">Aucune annonce pour le moment.</p>';
      } catch (e) { liste.innerHTML = `<p class="message">${socle.esc(e.message)}</p>`; }
    }

    // actions sur une annonce : écouteur unique (la politique de sécurité interdit les onclick=…)
    liste.addEventListener('click', async e => {
      const carte = e.target.closest('[data-id]'), bouton = e.target.closest('button');
      if (!carte || !bouton) return;
      try {
        if (bouton.hasAttribute('data-retirer')) {
          if (!confirm('Retirer cette annonce ?')) return;
          await socle.api(`/api/annonces/${carte.dataset.id}`, { method: 'DELETE' });
        } else await socle.api(`/api/annonces/${carte.dataset.id}`, { method: 'PATCH', body: { epingle: bouton.dataset.epingle === '1' } });
        afficher();
      } catch (err) { alert(err.message); }
    });

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('msg'), champ = id => document.getElementById(id);
      try {
        await socle.api('/api/annonces', { method: 'POST', body: { titre: champ('titre').value, texte: champ('texte').value, epingle: champ('epingle').checked } });
        e.target.reset(); gestion.message(msg, ''); afficher();
      } catch (err) { gestion.message(msg, err.message); }
    });

    gestion.coque().then(moi => {
      peutPublier = socle.peut(moi, 'annonces');
      document.getElementById('publier').hidden = !peutPublier;
      afficher();
    });
  </script>
</body>
</html>

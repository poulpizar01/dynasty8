# ============================================================================
# Dynasty 8 — configuration nginx (reverse proxy du VPS)
# ----------------------------------------------------------------------------
# nginx tourne sur l'HÔTE (pas dans Docker) et proxifie TOUT vers le conteneur
# applicatif, pages comprises : c'est le serveur Node qui sert /public et
# l'API. Le conteneur n'écoute que sur 127.0.0.1:3010 (voir compose.yaml,
# PORT_LOCAL) et n'est donc jamais joignable directement depuis Internet.
#
# Installation :
#   sudo cp deploy/vps/nginx-dynasty8.conf /etc/nginx/sites-available/dynasty8
#   sudo ln -s /etc/nginx/sites-available/dynasty8 /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # si le site par défaut gêne
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    # « _ » = accepte n'importe quel nom d'hôte : adresse IP du serveur,
    # nom de domaine, ancienne et nouvelle machine. Ce fichier n'a donc RIEN
    # à changer quand le site déménage sur un autre serveur (l'application
    # reconstruit ses URL à partir de l'en-tête Host transmis plus bas).
    server_name _;

    # Une annonce contenant encore d'anciennes photos base64 peut peser ~30 Mo
    # à l'enregistrement. L'application refuse elle-même au-delà (413).
    client_max_body_size 32m;

    access_log /var/log/nginx/dynasty8-access.log;
    error_log  /var/log/nginx/dynasty8-error.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # L'application reconstruit ses URL (retour OAuth Discord, cookies) à
        # partir de ces en-têtes : les trois sont nécessaires.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # NE PAS ajouter X-Frame-Options ni écraser Content-Security-Policy :
        # l'application pose elle-même « frame-ancestors … nui://game … » pour
        # l'ordinateur en jeu (FolkOS). Un en-tête ajouté ici afficherait une
        # page blanche en jeu, sans message d'erreur.
    }
}


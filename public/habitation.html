<head>

<meta name="description" content="Tous les biens Habitation de Dynasty 8 : Eclipse Tower, Del Perro Heights, Villa, Maison, Appartement et bien d'autres.">

<meta property="og:site_name" content="Dynasty 8">
<meta property="og:title" content="Habitation — Dynasty 8">
<meta property="og:description" content="Tous les biens Habitation de Dynasty 8 : Eclipse Tower, Del Perro Heights, Villa, Maison, Appartement et bien d'autres.">
<meta property="og:image" content="https://dynasty8.poulpizar.workers.dev/img/og-image.jpg">
<meta property="og:url" content="https://dynasty8.poulpizar.workers.dev/habitation.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
</head>
<body>

<header class="entete" id="site-entete"></header>

<section class="hero" style="padding:70px 24px 50px;">
  <div class="hero-etiquette" id="habitation-etiquette">🏠 Les Intérieurs</div>
  <h1 id="habitation-titre">Tous les logements de Los Santos</h1>
  <p class="lead" id="habitation-description">Des tours du centre-ville aux villas isolées, choisissez une adresse pour découvrir les biens disponibles.</p>
</section>

<section class="section serre">
  <div class="conteneur">
    <div class="d8-filtre2" id="filtre-habitation"></div>
    <div class="grille-biens" id="grille-biens"></div>
  </div>
</section>

<footer class="pied-page" id="site-pied"></footer>

<script src="/layout.js"></script>
<script src="/biens.js"></script>
<script>
  initialiserLayout("interieurs");

  // Le paramètre ?meuble=1 ou ?meuble=0 (venant du sous-menu "Les Intérieurs" ou de
  // la page /interieurs.html) adapte le texte d'intro et filtre le catalogue, sans
  // dupliquer cette page en deux fichiers séparés.
  const parametres = new URLSearchParams(window.location.search);
  const meubleBrut = parametres.get("meuble");
  let meuble; // undefined = les deux, true = meublés, false = non meublés
  if (meubleBrut === "1") {
    meuble = true;
    document.getElementById("habitation-etiquette").textContent = "🛋️ Intérieurs Meublés";
    document.getElementById("habitation-titre").textContent = "Les intérieurs déjà meublés";
    document.getElementById("habitation-description").textContent = "Emménagez immédiatement : ces biens sont livrés meublés et prêts à vivre, du studio à la villa de standing.";
    document.title = "Intérieurs Meublés — Dynasty 8";
  } else if (meubleBrut === "0") {
    meuble = false;
    document.getElementById("habitation-etiquette").textContent = "📦 Intérieurs Non Meublés";
    document.getElementById("habitation-titre").textContent = "Les intérieurs à aménager";
    document.getElementById("habitation-description").textContent = "Un espace vide, une toile blanche : idéal pour les résidents qui veulent aménager leur intérieur à leur image.";
    document.title = "Intérieurs Non Meublés — Dynasty 8";
  }

  // Les 19 sous-catégories (voir SOUS_CATEGORIES_HABITATION dans layout.js)
  // sont regroupées en 4 familles pour un filtre à deux niveaux plus lisible
  // que les 19 boutons à plat d'avant. "Autres" n'a pas de sous-filtre visible
  // (la ligne 2 se replie), mais couvre bien les 5 adresses qui ne rentrent
  // dans aucune des 3 autres familles, pour ne perdre aucune annonce.
  const FAMILLES_HABITATION = [
    { id: "residences", label: "Résidences", categories: ["Villa", "Maison"] },
    { id: "immeubles", label: "Immeubles", categories: [
        "Eclipse Tower", "Tinsel Tower", "Flat", "Motel", "Duplex",
        "Del Perro Heights", "Richards Majestic", "Weazel Plaza",
      ] },
    { id: "business", label: "Business", categories: ["Bureau", "Entrepôt", "Headquarter", "Bar"] },
    { id: "autres", label: "Autres", categories: [] },
  ];
  const SOUS_CATEGORIES_AUTRES = ["San Andreas", "Alta Street", "Caravane", "Appartement", "Autre"];

  function sousCategoriesDeFamille(familleId) {
    if (familleId === "autres") return SOUS_CATEGORIES_AUTRES;
    const famille = FAMILLES_HABITATION.find((f) => f.id === familleId);
    return famille ? famille.categories : [];
  }

  function familleDeSousCategorie(sousCategorie) {
    if (!sousCategorie) return null;
    const famille = FAMILLES_HABITATION.find((f) => f.categories.includes(sousCategorie));
    if (famille) return famille.id;
    return SOUS_CATEGORIES_AUTRES.includes(sousCategorie) ? "autres" : null;
  }

  let tousLesBiensHabitation = [];

  function appliquerFiltreAnnonces(familleId, categorieNom) {
    const conteneur = document.getElementById("grille-biens");
    let liste = tousLesBiensHabitation.filter((b) => sousCategoriesDeFamille(familleId).includes(b.sous_categorie));
    if (categorieNom) liste = liste.filter((b) => b.sous_categorie === categorieNom);
    conteneur.innerHTML = liste.length
      ? liste.map(carteBienHTML).join("")
      : '<div class="etat-vide">Aucune annonce dans cette catégorie pour le moment.</div>';
    if (liste.length) reveler(".carte-bien", conteneur);
  }

  const sousCategorieDepart = parametres.get("sous_categorie") || "";

  (async () => {
    tousLesBiensHabitation = await chargerBiens({ categorie: "habitation", meuble, cible: "grille-biens" });

    // Compteurs réels par sous-catégorie (nombre d'annonces), affichés comme
    // petit badge à côté du nom quand il y en a au moins une.
    const comptes = {};
    tousLesBiensHabitation.forEach((b) => { comptes[b.sous_categorie] = (comptes[b.sous_categorie] || 0) + 1; });
    const famillesAvecComptes = FAMILLES_HABITATION.map((f) => ({
      ...f,
      categories: f.categories.map((nom) => (comptes[nom] ? { nom, n: comptes[nom] } : nom)),
    }));

    construireFiltre2Niveaux({
      conteneur: "filtre-habitation",
      familles: famillesAvecComptes,
      familleDepart: familleDeSousCategorie(sousCategorieDepart) || "residences",
      categorieDepart: sousCategorieDepart || null,
      onChange: appliquerFiltreAnnonces,
    });
  })();
</script>
</body>
</html>

<style>
  :root{--navy-950:#060c1a;--navy-900:#0a1428;--navy-800:#0e1b33;--gold-300:#f2dfa8;--gold-400:#e4c77e;--gold-500:#c9a55c;--gold-600:#a9843f;
    --cream:#f6efe2;--text:#e3ddd2;--muted:#9aa6be;--serif:"Cormorant Garamond",Georgia,serif;--ui:"Jost","Helvetica Neue",Arial,sans-serif}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--navy-950);color:var(--cream);font-family:var(--ui);font-weight:300;-webkit-font-smoothing:antialiased;overflow:hidden}
  .scene{position:fixed;inset:0;
    background:radial-gradient(90% 70% at 50% 45%,#122241 0%,#0a1428 45%,#060c1a 100%)}
  /* veines dorées très discrètes (marbre) */
  .scene::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
    background:radial-gradient(55% 30% at 10% 8%,rgba(201,165,92,.14),transparent 60%),radial-gradient(40% 26% at 90% 20%,rgba(201,165,92,.11),transparent 62%),radial-gradient(45% 24% at 20% 90%,rgba(201,165,92,.09),transparent 60%),radial-gradient(38% 22% at 82% 88%,rgba(201,165,92,.08),transparent 60%)}
  #fx{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* cadre double filet or, comme sur le site */
  .cadre{position:fixed;inset:18px;pointer-events:none;border:1px solid rgba(201,165,92,.45);opacity:0;animation:app 1.6s 1.4s ease forwards}
  .cadre::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,165,92,.16)}
  @media (max-width:640px){.cadre{inset:10px}.cadre::before{display:none}}

  .ui{position:fixed;left:0;right:0;top:63%;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:0 24px;pointer-events:none}
  .ui > *{pointer-events:auto}
  .tag{margin:0;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-400);font-weight:500;opacity:0;animation:app 1.2s 2.0s ease forwards}
  .tag::before,.tag::after{content:"";display:inline-block;width:34px;height:1px;vertical-align:middle;margin:0 14px;background:linear-gradient(90deg,transparent,rgba(201,165,92,.7))}
  .tag::after{background:linear-gradient(90deg,rgba(201,165,92,.7),transparent)}
  .titre{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.1;color:var(--cream);opacity:0;animation:app 1.2s 2.25s ease forwards;text-wrap:balance}
  .entrer{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;height:58px;padding:0 40px;margin-top:6px;
    border:1px solid rgba(201,165,92,.65);border-radius:999px;background:rgba(201,165,92,.06);color:var(--gold-300);
    font-family:var(--ui);font-size:12.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;text-decoration:none;
    opacity:0;animation:app 1.2s 2.6s ease forwards;transition:background .35s,color .35s,box-shadow .35s,transform .35s;overflow:hidden}
  .entrer::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#7a5c2e 0%,#c9a55c 22%,#f2dfa8 45%,#c9a55c 70%,#8a6a34 100%);opacity:0;transition:opacity .35s}
  .entrer span{position:relative}
  .entrer svg{position:relative;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
  .entrer:hover,.entrer:focus-visible{color:#1a1408;box-shadow:0 10px 34px rgba(201,165,92,.28);transform:translateY(-1px);outline:none}
  .entrer:hover::before,.entrer:focus-visible::before{opacity:1}
  .entrer:hover svg{transform:translateX(4px)}
  .pied{position:fixed;left:0;right:0;bottom:30px;text-align:center;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);opacity:0;animation:app 1.2s 3s ease forwards}
  .pied a{color:var(--gold-500);text-decoration:none}
  body.sortie .ui,body.sortie .pied,body.sortie .cadre{animation:none;opacity:0;transition:opacity .6s}
  @keyframes app{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.tag,.titre,.entrer,.pied,.cadre{animation-duration:.01s;animation-delay:0s}}

<body>
<!-- Page d'entrée du site (voir accueil.html pour l'accueil proprement dit).
     Three.js en local : /vendor/three.module.min.js — logo : /img/logo-full.png. -->
<div class="scene"><canvas id="fx"></canvas></div>
<div class="cadre"></div>

<div class="ui">
  <p class="tag">Agence immobilière · Los Santos</p>
  <h1 class="titre">Trouvez le bien qui porte votre nom.</h1>
  <a class="entrer" id="entrer" href="/accueil.html"><span>Entrer sur le site</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
<p class="pied">Serveur RP FlashbackFA · Univers fictif · <a href="/admin.html">Espace agents</a></p>

<script type="importmap">
{ "imports": { "three": "/vendor/three.module.min.js" } }
</script>
<noscript><style>.tag,.titre,.entrer,.pied,.cadre{opacity:1;animation:none}</style></noscript>
</body>
</html>
<script type="module">
import * as THREE from 'three';
(function(){
  const LOGO = "/img/logo-full.png";
  const LOGO_ASP = 917/507;
  const canvas = document.getElementById('fx');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 1.5)); renderer.setClearColor(0x000000, 0); renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100); cam.position.z = 10;
  const monde = new THREE.Group(); scene.add(monde);      // tout ce qui s'incline avec la souris

  // ---------- particules : halo qui converge autour du logo ----------
  const N = 2200;
  const start = new Float32Array(N*3), end = new Float32Array(N*3), seed = new Float32Array(N), size = new Float32Array(N);
  const gauss = ()=>{ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  // demi-axes du logo (largeur de référence 5.2) : le halo commence juste au-delà de son bord
  const LX = 2.6, LY = 2.6/LOGO_ASP;
  for (let i=0;i<N;i++){
    const halo = i < N*0.68;
    let ex, ey, ez;
    if (halo){
      // anneau elliptique face caméra, épaisseur gaussienne vers l'extérieur, jamais sur le logo
      const a = Math.random()*Math.PI*2, sp = 0.18 + Math.abs(gauss())*0.42;
      ex = Math.cos(a)*(LX*1.12 + sp*1.35); ey = Math.sin(a)*(LY*1.18 + sp*1.1); ez = (Math.random()*2-1)*0.9;
    } else {
      // poussière rare et large, en évitant une ellipse autour du logo
      do { ex = (Math.random()*2-1)*9.5; ey = (Math.random()*2-1)*5.5; }
      while ((ex*ex)/((LX*1.9)*(LX*1.9)) + (ey*ey)/((LY*2.4)*(LY*2.4)) < 1.0);
      ez = (Math.random()*2-1)*3.0 - 1.0;
    }
    end[i*3]=ex; end[i*3+1]=ey; end[i*3+2]=ez;
    // départ : éparpillées loin, en sphère
    const u=Math.random()*Math.PI*2, v=Math.acos(2*Math.random()-1), d=10+Math.random()*10;
    start[i*3]=Math.sin(v)*Math.cos(u)*d; start[i*3+1]=Math.sin(v)*Math.sin(u)*d*0.7; start[i*3+2]=Math.cos(v)*d;
    seed[i]=Math.random()*6.283; size[i]= halo ? 0.45+Math.random()*0.75 : 0.3+Math.random()*0.5;
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(end,3));
  pg.setAttribute('aStart', new THREE.BufferAttribute(start,3));
  pg.setAttribute('aSeed', new THREE.BufferAttribute(seed,1));
  pg.setAttribute('aSize', new THREE.BufferAttribute(size,1));
  const pu = {uTime:{value:0}, uPix:{value:1}, uIn:{value:0}, uOut:{value:0}};
  const pm = new THREE.ShaderMaterial({uniforms:pu, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`
      uniform float uTime,uPix,uIn,uOut; attribute vec3 aStart; attribute float aSeed,aSize; varying float vA;
      void main(){
        float k = 1.0 - pow(1.0 - uIn, 3.0);                         // ease-out
        vec3 p = mix(aStart, position, k);
        p.y += sin(uTime*0.6 + aSeed*4.0)*0.06;                       // respiration
        p += normalize(vec3(p.xy, 0.0) + 0.001) * (uOut*uOut*22.0);  // sortie : explosion douce, dans le plan
        vec4 mv = modelViewMatrix * vec4(p,1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPix * (38.0 / -mv.z);                 // uPix = échelle liée à la hauteur d'écran
        vA = (0.35 + 0.65*(0.5+0.5*sin(uTime*1.4 + aSeed*3.0))) * k * (1.0 - uOut);
      }`,
    fragmentShader:`
      precision highp float; varying float vA;
      void main(){ vec2 c=gl_PointCoord-0.5; float d=length(c); if(d>0.5) discard;
        float g=smoothstep(0.5,0.0,d); vec3 col=mix(vec3(0.72,0.50,0.22),vec3(0.98,0.90,0.66),g);
        gl_FragColor=vec4(col, g*g*vA); }`
  });
  const halo = new THREE.Points(pg, pm); monde.add(halo);


  // ---------- lueur derrière le logo ----------
  const gu = {uTime:{value:0}, uIn:{value:0}, uOut:{value:0}};
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(11,11), new THREE.ShaderMaterial({uniforms:gu, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`precision highp float; varying vec2 vUv; uniform float uTime,uIn,uOut;
      void main(){ float d=length((vUv-0.5)*vec2(1.0,1.35)); float g=smoothstep(0.6,0.0,d);
        float pulse=0.85+0.15*sin(uTime*0.8); float a=g*g*0.30*pulse*uIn*(1.0-uOut);
        gl_FragColor=vec4(vec3(0.86,0.68,0.36)*a, a); }`}));
  glow.position.z = -0.4; monde.add(glow);

  // ---------- logo : plan texturé + reflet doré qui balaie ----------
  const lu = {uTex:{value:null}, uTime:{value:0}, uIn:{value:0}, uOut:{value:0}};
  const logoMat = new THREE.ShaderMaterial({uniforms:lu, transparent:true, depthWrite:false,
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`precision highp float; varying vec2 vUv; uniform sampler2D uTex; uniform float uTime,uIn,uOut;
      void main(){
        vec4 t = texture2D(uTex, vUv);
        // balayage lumineux diagonal toutes les ~6 s
        float sweep = fract(uTime/6.0)*2.2-0.6; float band = exp(-pow((vUv.x + vUv.y*0.35 - sweep)*7.0, 2.0));
        vec3 col = t.rgb + vec3(0.98,0.90,0.66)*band*0.55*t.a;
        // apparition : fondu + très léger voile doré au début
        float a = t.a * smoothstep(0.0,1.0,uIn) * (1.0-uOut);
        gl_FragColor = vec4(col, a);
      }`});
  const logo = new THREE.Mesh(new THREE.PlaneGeometry(1,1), logoMat); monde.add(logo);
  new THREE.TextureLoader().load(LOGO, (tex)=>{ tex.colorSpace=THREE.SRGBColorSpace; tex.minFilter=THREE.LinearMipmapLinearFilter; tex.anisotropy=renderer.capabilities.getMaxAnisotropy(); lu.uTex.value=tex; });

  // ---------- dimensions : le logo occupe ~24 % de la hauteur, jamais plus de 78 % de la largeur ----------
  function resize(){
    const w=canvas.clientWidth, h=canvas.clientHeight;
    renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
    const worldH = 2*Math.tan(THREE.MathUtils.degToRad(cam.fov/2))*cam.position.z, worldW = worldH*cam.aspect;
    let lh = worldH*0.26, lw = lh*LOGO_ASP;
    if (lw > worldW*0.78){ lw = worldW*0.78; lh = lw/LOGO_ASP; }
    logo.scale.set(lw, lh, 1);
    const s = lw/5.2;                                    // le halo suit la taille du logo
    halo.scale.set(s,s,s); glow.scale.set(s,s,1);
    monde.position.y = worldH*0.10;                      // logo légèrement au-dessus du centre
    pu.uPix.value = (h*renderer.getPixelRatio())/900;   // même rendu visuel en 1080p et en 1440p
  }
  addEventListener('resize', resize); resize();

  // ---------- souris : inclinaison de l'ensemble ----------
  const mouse={x:0,y:0}, ms={x:0,y:0};
  addEventListener('pointermove', e=>{ mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-((e.clientY/innerHeight)*2-1); }, {passive:true});

  // ---------- timeline ----------
  const t0 = performance.now(); let sortieT = null;
  const ENTREE = reduced ? 0.6 : 2.8;
  function frame(now){
    requestAnimationFrame(frame);
    const t=(now-t0)/1000;
    const tIn = Math.min(1, t/ENTREE);
    const out = sortieT===null ? 0 : Math.min(1, (now-sortieT)/1100);
    ms.x+=(mouse.x-ms.x)*0.05; ms.y+=(mouse.y-ms.y)*0.05;
    monde.rotation.y = ms.x*0.18; monde.rotation.x = -ms.y*0.12;
    if (!reduced) halo.rotation.z = t*0.04;
    pu.uTime.value=gu.uTime.value=lu.uTime.value=t;
    pu.uIn.value=tIn; gu.uIn.value=Math.max(0,(tIn-0.25)/0.75); lu.uIn.value=Math.max(0,(tIn-0.3)/0.7);
    pu.uOut.value=gu.uOut.value=lu.uOut.value=out;
    logo.scale.z = 1; logo.position.z = out*1.5;         // le logo s'avance vers nous en sortant
    renderer.render(scene, cam);
  }
  requestAnimationFrame(frame);

  // ---------- « Entrer sur le site » : sortie animée puis navigation ----------
  const bouton = document.getElementById('entrer');
  bouton.addEventListener('click', (e)=>{
    if (sortieT!==null) return;
    e.preventDefault(); sortieT=performance.now(); document.body.classList.add('sortie');
    const href = bouton.getAttribute('href');
    setTimeout(()=>{ window.location.href = href; }, 1150);
  });
})();
</script>
<noscript><style>.tag,.titre,.entrer,.pied,.cadre{opacity:1;animation:none}</style></noscript>
</body>

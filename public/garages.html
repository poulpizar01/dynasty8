<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garages — Dynasty 8</title>
<meta name="description" content="Garages et box de stationnement à la vente ou à la location avec Dynasty 8.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dynasty 8">
<meta property="og:title" content="Garages — Dynasty 8">
<meta property="og:description" content="Garages et box de stationnement à la vente ou à la location avec Dynasty 8.">
<meta property="og:image" content="https://dynasty8.poulpizar.workers.dev/img/og-image.jpg">
<meta property="og:url" content="https://dynasty8.poulpizar.workers.dev/garages.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Garages — Dynasty 8">
<meta name="twitter:description" content="Garages et box de stationnement à la vente ou à la location avec Dynasty 8.">
<meta name="twitter:image" content="https://dynasty8.poulpizar.workers.dev/img/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
</head>
<body>

<header class="entete" id="site-entete"></header>

<section class="hero" style="padding:70px 24px 50px;">
  <div class="hero-etiquette">🚗 Garages</div>
  <h1>Un abri sûr pour vos véhicules</h1>
  <p class="lead">Du box individuel au garage collection grande capacité, sécurisez et rangez vos véhicules dans toute la ville.</p>
  <div class="hero-stats" id="garages-stats">
    <div><strong id="garages-total">—</strong><span>Garages disponibles</span></div>
    <div><strong id="garages-prix-min">—</strong><span>À partir de (vente)</span></div>
    <div><strong id="garages-loc-min">—</strong><span>À partir de (location/sem.)</span></div>
  </div>
</section>

<section class="section serre">
  <div class="conteneur">
    <div class="filtres" id="filtres-garages">
      <button class="filtre actif" data-filtre="tous">Tous</button>
      <button class="filtre" data-filtre="petit">1 à 6 places</button>
      <button class="filtre" data-filtre="moyen">7 à 15 places</button>
      <button class="filtre" data-filtre="grand">16 places et +</button>
      <button class="filtre" data-filtre="vip">VIP</button>
    </div>
    <div class="grille-biens" id="grille-biens"></div>
  </div>
</section>

<footer class="pied-page" id="site-pied"></footer>

<script src="/layout.js"></script>
<script src="/biens.js"></script>
<script>
  initialiserLayout("garages");

  // Les garages n'ont pas de sous-catégorie comme les habitations : on filtre
  // ici par nombre de places (le critère qui compte pour ce type de bien),
  // directement sur la liste déjà chargée (pas de nouvel appel réseau).
  let tousLesGarages = [];

  function nombrePlaces(bien) {
    // Le champ "places" n'est pas toujours renseigné dans l'espace agents :
    // on retombe sur le titre ("Garage 25 places"), qui lui est toujours écrit.
    if (bien.places) return Number(bien.places);
    const trouve = (bien.titre || "").match(/(\d+)\s*places?/i);
    return trouve ? Number(trouve[1]) : 0;
  }

  function trancheDePlaces(bien) {
    const p = nombrePlaces(bien);
    if (p <= 6) return "petit";
    if (p <= 15) return "moyen";
    return "grand";
  }

  function appliquerFiltreGarages(filtre) {
    const conteneur = document.getElementById("grille-biens");
    let liste = tousLesGarages;
    if (filtre === "vip") {
      liste = tousLesGarages.filter((b) => b.vip);
    } else if (filtre !== "tous") {
      liste = tousLesGarages.filter((b) => trancheDePlaces(b) === filtre);
    }
    conteneur.innerHTML = liste.length
      ? liste.map(carteBienHTML).join("")
      : '<div class="etat-vide">Aucun garage dans cette catégorie pour le moment.</div>';
    if (liste.length) reveler(".carte-bien", conteneur);
  }

  function majStatsGarages(liste) {
    const prixVente = liste.filter((b) => b.dispo_vente && b.prix).map((b) => b.prix);
    const prixLocation = liste.filter((b) => b.dispo_location && b.prix_location).map((b) => b.prix_location);
    document.getElementById("garages-total").textContent = liste.length;
    document.getElementById("garages-prix-min").textContent = prixVente.length ? formaterPrix(Math.min(...prixVente)) : "—";
    document.getElementById("garages-loc-min").textContent = prixLocation.length ? formaterPrix(Math.min(...prixLocation)) : "—";
  }

  (async () => {
    tousLesGarages = await chargerBiens({ categorie: "garage", cible: "grille-biens" });
    majStatsGarages(tousLesGarages);
    document.querySelectorAll("#filtres-garages .filtre").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#filtres-garages .filtre").forEach((b) => b.classList.remove("actif"));
        btn.classList.add("actif");
        appliquerFiltreGarages(btn.dataset.filtre);
      });
    });
  })();
</script>
</body>
</html>

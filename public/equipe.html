<body>

<header class="entete" id="site-entete"></header>

<section class="hero" style="padding:70px 24px 50px;">
  <div class="hero-etiquette">👥 Notre équipe</div>
  <h1>Les visages de Dynasty 8</h1>
  <p class="lead">Une équipe d'agents présents sur le terrain pour vous accompagner à chaque étape de votre projet immobilier.</p>
</section>

<section class="section serre">
  <div class="conteneur">
    <div class="grille-equipe" id="grille-equipe"></div>
    <p class="champ-aide" style="text-align:center;margin-top:24px;">Équipe de démonstration — remplacez les noms et rôles dans <code>equipe.html</code> par les vrais membres de votre agence.</p>
  </div>
</section>

<footer class="pied-page" id="site-pied"></footer>

<script src="/layout.js"></script>
<script>
  initialiserLayout("equipe");

  const EQUIPE = [
    { nom: "Alexia Ferrero", role: "Directrice de l'agence" },
    { nom: "Mika Duval", role: "Agent — Biens exclusifs" },
    { nom: "Toni Reyes", role: "Agent — Habitation" },
    { nom: "Sasha Cole", role: "Agent — Garages" },
    { nom: "Nova Bianchi", role: "Conseillère investissement" },
    { nom: "Eliot Marchetti", role: "Agent — Habitation" },
  ];

  document.getElementById("grille-equipe").innerHTML = EQUIPE.map((m) => `
    <div class="carte-membre">
      <div class="avatar">${m.nom.split(" ").map((p) => p[0]).join("")}</div>
      <h3>${m.nom}</h3>
      <span class="role">${m.role}</span>
    </div>`).join("");
</script>
</body>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ — Dynasty 8</title>
<meta name="description" content="Questions fréquentes sur les services immobiliers de Dynasty 8.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Dynasty 8">
<meta property="og:title" content="FAQ — Dynasty 8">
<meta property="og:description" content="Questions fréquentes sur les services immobiliers de Dynasty 8.">
<meta property="og:image" content="https://dynasty8.poulpizar.workers.dev/img/og-image.jpg">
<meta property="og:url" content="https://dynasty8.poulpizar.workers.dev/faq.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FAQ — Dynasty 8">
<meta name="twitter:description" content="Questions fréquentes sur les services immobiliers de Dynasty 8.">
<meta name="twitter:image" content="https://dynasty8.poulpizar.workers.dev/img/og-image.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
</head>
<body>

<header class="entete" id="site-entete"></header>

<section class="hero" style="padding:70px 24px 50px;">
  <div class="hero-etiquette">? FAQ</div>
  <h1>Questions fréquentes</h1>
  <p class="lead">Retrouvez les réponses aux questions les plus posées par nos clients.</p>
</section>

<section class="section serre">
  <div class="conteneur" style="max-width:760px;">
    <div id="accordeon"></div>
    <p class="champ-aide" style="text-align:center;margin-top:24px;">Contenu de démonstration — modifiez les questions dans <code>faq.html</code> selon les règles réelles de votre serveur.</p>
  </div>
</section>

<footer class="pied-page" id="site-pied"></footer>

<script src="/layout.js"></script>
<script>
  initialiserLayout("faq");

  const FAQ = [
    { q: "Comment acheter un bien avec Dynasty 8 ?", r: "Repérez le bien qui vous intéresse en jeu (avec l'aide d'Agatha à l'agence, ou en explorant les emplacements disponibles), vérifiez son secteur et sa disponibilité grâce aux fiches de cohérence et à la WebMap sur ce site, puis contactez l'agence via l'application Eyefind pour demander un agent. Restez sur place : un agent vous rejoint rapidement pour finaliser la vente et signer le contrat." },
    { q: "Puis-je louer un bien pour une courte durée ?", r: "Oui, certains biens Habitation et Garage sont proposés à la location à la semaine. Le type de transaction est indiqué directement sur chaque annonce." },
    { q: "Comment sont classés les biens Habitation ?", r: "Chaque bien Habitation est rattaché à une adresse précise (Eclipse Tower, Villa, Del Perro Heights...) : utilisez les filtres de la page « Habitation » pour retrouver rapidement un type de logement." },
    { q: "Comment devenir agent chez Dynasty 8 ?", r: "Le recrutement se fait directement via le Discord du serveur. Contactez la direction de l'agence pour connaître les conditions en vigueur." },
    { q: "Les prix affichés sont-ils fixes ?", r: "Les prix indiqués sont ceux pratiqués au catalogue. Ils peuvent être ajustés par un agent en fonction de la situation de votre personnage." },
  ];

  document.getElementById("accordeon").innerHTML = FAQ.map((item, i) => `
    <div class="accordeon-item" data-i="${i}">
      <button class="accordeon-question">${item.q}<span class="chevron">⌄</span></button>
      <div class="accordeon-reponse"><p>${item.r}</p></div>
    </div>`).join("");

  document.querySelectorAll(".accordeon-question").forEach((btn) => {
    btn.addEventListener("click", () => btn.parentElement.classList.toggle("ouvert"));
  });
</script>
</body>
</html>
